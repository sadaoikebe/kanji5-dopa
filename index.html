<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>漢字ブースト⑤ — 5年生の漢字 爆速トレーニング</title>
<style>
:root{--c0:#ff4fd8;--c1:#35e6ff;--c2:#fff23a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#000;overflow:hidden;color:#fff;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#fx{z-index:2;pointer-events:none}
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.hide{display:none!important}
.glow{text-shadow:0 0 10px var(--c0),0 0 26px var(--c1),0 0 54px var(--c2)}
.grad{background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2),var(--c0));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:gradrun 1.2s linear infinite}
@keyframes gradrun{to{background-position:300% 0}}

/* ───── タイトル ───── */
#title .logo{font-weight:900;line-height:.95;text-align:center;transform:rotate(-6deg)}
#title .logo .a{display:block;font-size:min(34vw,24vh);-webkit-text-stroke:3px #fff;filter:drop-shadow(0 0 18px var(--c0)) drop-shadow(0 0 40px var(--c1))}
#title .logo .b{display:block;font-size:min(15vw,10vh);font-style:italic;letter-spacing:.05em;color:#fff;margin-top:.1em}
#title .logo .b i{font-style:normal;color:var(--c2)}
#title .sub{margin-top:4vh;font-size:min(4.6vw,2.8vh);font-weight:800;text-align:center;line-height:1.6;opacity:.95}
#title .stats{margin-top:1.4vh;font-size:min(4vw,2.4vh);font-weight:700;opacity:.85;text-align:center}
.btns{display:flex;flex-direction:column;gap:1.6vh;margin-top:4vh;width:min(86vw,440px)}
.btn{font:inherit;font-weight:900;font-size:min(7vw,4.4vh);padding:1.6vh 0;border-radius:999px;border:4px solid #fff;color:#000;cursor:pointer;
  background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2));box-shadow:0 0 24px var(--c0),0 0 60px var(--c1);letter-spacing:.08em}
.btn.main{animation:throb .7s ease-in-out infinite}
.btn.sub2{background:rgba(0,0,0,.55);color:#fff;border-color:var(--c1);box-shadow:0 0 18px var(--c1);font-size:min(5.4vw,3.4vh)}
.btn:active{transform:scale(.94)}
@keyframes throb{50%{transform:scale(1.06)}}
.hint{margin-top:2.4vh;font-size:min(3.4vw,2vh);opacity:.7}

/* ───── ゲーム ───── */
#game{justify-content:flex-start;padding-top:max(10px,env(safe-area-inset-top))}
#hud{width:min(100%,680px);height:19vh;display:flex;align-items:center;justify-content:space-between;flex:none}
.hbox{width:28%;text-align:center;font-weight:900}
.hbox .lb{font-size:min(3.4vw,1.9vh);letter-spacing:.15em;opacity:.85}
.hbox .v{font-size:min(8vw,5vh);line-height:1.05;font-variant-numeric:tabular-nums}
#combo .v{font-size:min(12vw,7.4vh)}
#combo .x{font-size:min(3.6vw,2vh);color:var(--c2)}
.bump{animation:bump .25s cubic-bezier(.2,2,.4,1)}
@keyframes bump{0%{transform:scale(1.7)}100%{transform:scale(1)}}
#gaugeSlot{width:40%;height:100%}
#timeTxt{font-size:min(3.6vw,2.1vh);font-weight:900;height:3vh;font-variant-numeric:tabular-nums;letter-spacing:.1em;flex:none}
#timeTxt.low{color:#ff3355;animation:throb .4s infinite}
#ticker{height:4vh;font-size:min(4vw,2.4vh);font-weight:800;opacity:.9;flex:none;display:flex;align-items:center}
#ticker.ok{color:#9dff9a}#ticker.ng{color:#ff6b84}
#card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:0}
#card.in{animation:cardin .16s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardin{0%{transform:scale(1.8);opacity:0;filter:blur(10px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
#reading{font-size:min(9vw,6vh);font-weight:900;letter-spacing:.12em;margin-bottom:1vh;
  text-shadow:0 0 8px #000,0 0 18px var(--c1)}
#word{font-size:min(22vw,15vh);font-weight:900;line-height:1.1;white-space:nowrap;
  text-shadow:0 0 6px #000,0 0 22px var(--c0),0 0 48px var(--c1)}
.hole{display:inline-block;min-width:1em;text-align:center;border:.06em dashed var(--c2);border-radius:.14em;color:var(--c2);
  animation:holeb .5s steps(2) infinite;margin:0 .04em}
@keyframes holeb{50%{border-color:#fff;color:#fff}}
.hole.filled{border-color:transparent;animation:fill .35s cubic-bezier(.2,2,.4,1);color:#fff;
  text-shadow:0 0 12px var(--c2),0 0 30px var(--c2),0 0 60px #fff}
.hole.miss{border-color:#ff3355;color:#ff3355;animation:fill .35s cubic-bezier(.2,2,.4,1);text-shadow:0 0 18px #ff3355}
@keyframes fill{0%{transform:scale(2.4) rotate(12deg)}100%{transform:scale(1)}}
#choices{width:min(100%,680px);display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 4px 2vh;flex:none;height:40vh}
.ch{position:relative;font:inherit;font-weight:900;font-size:min(17vw,12vh);color:#fff;cursor:pointer;border-radius:22px;
  border:4px solid var(--c1);background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  box-shadow:0 0 16px var(--c1),inset 0 0 22px rgba(255,255,255,.08);text-shadow:0 0 14px var(--c0);
  transition:transform .06s;line-height:1}
.ch:active{transform:scale(.93)}
.ch .n{position:absolute;left:10px;top:6px;font-size:min(3.4vw,1.8vh);opacity:.55;text-shadow:none}
.ch.good{animation:good .4s ease-out;border-color:#fff;background:rgba(255,255,255,.35)}
@keyframes good{0%{transform:scale(1.18);box-shadow:0 0 80px #fff,0 0 140px var(--c2)}100%{transform:scale(1)}}
.ch.bad{animation:bad .35s;border-color:#ff3355;background:rgba(255,30,70,.45);box-shadow:0 0 40px #ff3355}
@keyframes bad{20%{transform:translateX(-14px) rotate(-3deg)}40%{transform:translateX(12px) rotate(3deg)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.ch.reveal{border-color:var(--c2);background:rgba(255,220,60,.35);animation:throb .3s infinite;box-shadow:0 0 50px var(--c2)}

/* ───── 叩きつけ文字・ポップ ───── */
#slam{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;font-weight:900}
#slam .l1{font-size:min(19vw,14vh);line-height:1;-webkit-text-stroke:2px #fff;opacity:0;filter:drop-shadow(0 0 16px var(--c0)) drop-shadow(0 0 40px var(--c1))}
#slam .l2{font-size:min(7vw,4.6vh);margin-top:1vh;opacity:0;color:#fff;text-shadow:0 0 10px #000,0 0 24px var(--c2)}
#slam.go .l1{animation:slam 1.3s cubic-bezier(.2,1.6,.4,1) forwards}
#slam.go .l2{animation:slam2 1.3s ease-out forwards}
#slam.quick .l1{animation:slam .62s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes slam{0%{transform:scale(4) rotate(-10deg);opacity:0;filter:blur(10px)}14%{transform:scale(.92) rotate(-4deg);opacity:1;filter:blur(0) drop-shadow(0 0 16px var(--c0))}
  24%{transform:scale(1.08) rotate(-4deg)}72%{transform:scale(1) rotate(-4deg);opacity:1}100%{transform:scale(1.35) rotate(-4deg);opacity:0}}
@keyframes slam2{0%,15%{opacity:0;transform:translateY(30px)}30%,75%{opacity:1;transform:none}100%{opacity:0}}
.pop{position:fixed;z-index:3;pointer-events:none;font-weight:900;font-size:min(8vw,5vh);white-space:nowrap;
  animation:popup .85s ease-out forwards;-webkit-text-stroke:1px #000;text-shadow:0 0 12px var(--c2),0 0 26px var(--c0)}
.pop.big{font-size:min(11vw,7vh);color:var(--c2)}
@keyframes popup{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}18%{transform:translate(-50%,-90%) scale(1.35)}100%{transform:translate(-50%,-280%) scale(1);opacity:0}}

/* ───── 結果 ───── */
#result{justify-content:flex-start;padding-top:max(4vh,env(safe-area-inset-top));overflow-y:auto}
#rank{font-size:min(44vw,26vh);font-weight:900;line-height:1;-webkit-text-stroke:4px #fff;filter:drop-shadow(0 0 20px var(--c0)) drop-shadow(0 0 50px var(--c2))}
#rscore{font-size:min(13vw,8vh);font-weight:900;font-variant-numeric:tabular-nums}
#rnew{font-size:min(6vw,3.6vh);font-weight:900;color:var(--c2);animation:throb .5s infinite;height:4.4vh}
#rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,560px);margin:1.6vh 0}
#rgrid div{background:rgba(0,0,0,.5);border:2px solid var(--c1);border-radius:14px;padding:8px 2px;text-align:center;font-weight:900}
#rgrid b{display:block;font-size:min(6.4vw,3.6vh)}#rgrid span{font-size:min(3vw,1.7vh);opacity:.8}
#rmissT{font-weight:900;font-size:min(4.4vw,2.6vh);margin-top:.6vh}
#rmiss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(94vw,620px);margin-top:1vh}
#rmiss div{background:rgba(255,30,70,.25);border:2px solid #ff3355;border-radius:12px;padding:6px 10px;text-align:center;min-width:5em}
#rmiss b{font-size:min(8vw,4.6vh);display:block;line-height:1.1}#rmiss span{font-size:min(3.2vw,1.8vh)}
#result .btns{margin:2.4vh 0 4vh}
#mute{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;font-size:22px;background:rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer}
#game ~ #mute{opacity:.5}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="title" class="screen">
  <div class="logo"><span class="a grad">漢字</span><span class="b glow">ブースト<i>⑤</i></span></div>
  <div class="sub glow">5年生の漢字 <span id="tN"></span>字を<br>60秒で ぶっちぎり インプット!!</div>
  <div class="stats" id="tStats"></div>
  <div class="btns">
    <button class="btn main" id="bStart">▶ スタート</button>
    <button class="btn sub2" id="bWeak">🔥 苦手だけ特訓</button>
  </div>
  <div class="hint">タップ or 1〜4キーで答える ・ Space でスタート</div>
</div>

<div id="game" class="screen hide">
  <div id="hud">
    <div class="hbox" id="scoreBox"><div class="lb">SCORE</div><div class="v" id="score">0</div></div>
    <div id="gaugeSlot"></div>
    <div class="hbox" id="combo"><div class="lb">COMBO</div><div class="v" id="comboV">0</div><div class="x" id="multV">×1.0</div></div>
  </div>
  <div id="timeTxt">60.0</div>
  <div id="ticker"></div>
  <div id="card">
    <div id="reading"></div>
    <div id="word"></div>
  </div>
  <div id="choices">
    <button class="ch" data-i="0"></button><button class="ch" data-i="1"></button>
    <button class="ch" data-i="2"></button><button class="ch" data-i="3"></button>
  </div>
</div>

<div id="result" class="screen hide">
  <div id="rank" class="grad">S</div>
  <div id="rscore" class="glow">0</div>
  <div id="rnew"></div>
  <div id="rgrid">
    <div><b id="rC">0</b><span>正解</span></div>
    <div><b id="rA">0%</b><span>正答率</span></div>
    <div><b id="rM">0</b><span>最大COMBO</span></div>
    <div><b id="rK">0</b><span>最高 漢/分</span></div>
  </div>
  <div id="rmissT"></div>
  <div id="rmiss"></div>
  <div class="btns">
    <button class="btn main" id="bAgain">▶ もう一回!!</button>
    <button class="btn sub2" id="bWeak2">🔥 苦手だけ特訓</button>
    <button class="btn sub2" id="bTitle">タイトルへ</button>
  </div>
</div>

<canvas id="fx"></canvas>
<div id="slam"><div class="l1 grad"></div><div class="l2"></div></div>
<button id="mute" title="音のオン/オフ">🔊</button>

<script>

// ───────────────────────── 5年生の漢字 (漢字|例の言葉|読み) ─────────────────────────

const DATA = RAW.trim().split("\n").map(l => { const [k, w, r] = l.trim().split("|"); return { k, w, r }; });

// ───────────────────────── 調整用の定数 ─────────────────────────
const GAME_SEC = 60;
const MISS_PENALTY = 2;        // 秒
const FAST_BONUS_SEC = 0.4;    // 速答で時間が増える
const KPM_MAX = 60;            // メーターの上限 (漢/分)
const MILESTONES = [10, 20, 30, 50, 75, 100, 150, 200];
const GEARS = [0, 10, 30];     // この COMBO でギアが上がる
const GEAR_NAMES = ["GEAR 1 徒歩", "GEAR 2 爆走", "GEAR 3 新幹線"];
const GOD_COMBO = 50;          // ここから金色
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FLASH_MIN_INTERVAL = REDUCED ? 600 : 140; // ms

// ───────────────────────── 小道具 ─────────────────────────
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const frac = x => x - Math.floor(x);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function hash(i, s) {
  let x = (Math.imul(i, 374761393) + Math.imul(s, 668265263)) | 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16;
  return (x & 0xFFFFFF) / 16777216;

  $("#tN").textContent = DATA.length;
  const m = DATA.filter(d => mastered(d.k)).length, wk = weakList().length;
  $("#tStats").textContent = `ベスト ${save.best.toLocaleString()} ・ マスター ${m}/${DATA.length}字`;
  for (const b of [$("#bWeak"), $("#bWeak2")]) { b.classList.toggle("hide", wk === 0); b.textContent = `🔥 苦手だけ特訓 (${wk}字)`; }
}

function start(weak) {
  audio();
  const pool = weak ? weakList() : DATA;
  if (!pool.length) return;
  G = { pool, weak, score: 0, shown: 0, combo: 0, maxCombo: 0, ok: 0, ng: 0, timeLeft: GAME_SEC, qCount: 0, lock: true,
        q: null, wrong: new Map(), requeue: [], recent: [], hits: [], kpm: 0, maxKpm: 0 };
  fx.gear = 0; fx.morphFrom = 0; fx.morphAt = -99;
  comboV.textContent = "0"; multV.textContent = "×1.0"; scoreV.textContent = "0"; ticker.textContent = ""; timeTxt.textContent = GAME_SEC.toFixed(1);
  show("game"); phase = "count";
  next(); G.lock = true; cardEl.style.visibility = "hidden";
  const steps = ["3", "2", "1"];
  steps.forEach((s, i) => setTimeout(() => { slam(s, "", true); sfx.count(false); shockwave(W / 2, H / 2, .6); }, i * 550));
  setTimeout(() => {
    slam("GO!!", weak ? "苦手特訓モード" : GEAR_NAMES[0]); sfx.count(true); flash(.6); shockwave(W / 2, H / 2, 1.4); fireworks(4);
    phase = "play"; G.lock = false; cardEl.style.visibility = ""; G.q.at = fx.t; cardIn();
  }, steps.length * 550);
}

function pickItem() {
  const d = G.requeue.findIndex(r => r.due <= G.qCount);
  if (d >= 0) return G.requeue.splice(d, 1)[0].item;
  const pool = G.pool; let tot = 0;
  const ws = pool.map(x => {
    if (G.recent.includes(x.k)) return 0;
    const s = save.stats[x.k] || [0, 0], w = Math.max(.25, 1 + 2 * s[1] - .4 * s[0]);
    tot += w; return w;
  });
  if (tot <= 0) return pool[Math.random() * pool.length | 0];
  let r = Math.random() * tot;
  for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function next() {
  const item = pickItem();
  G.recent.push(item.k); while (G.recent.length > Math.min(6, G.pool.length - 1)) G.recent.shift();
  const others = shuffle(DATA.filter(d => d.k !== item.k && !item.w.includes(d.k))).slice(0, 3).map(d => d.k);
  G.q = { item, choices: shuffle([item.k, ...others]), at: fx.t };
  G.qCount++;
  reading.textContent = item.r;
  word.textContent = ""; holeEl = null;
  for (const ch of item.w) {
    const s = document.createElement("span");
    if (ch === item.k && !holeEl) { s.className = "hole"; s.textContent = "？"; holeEl = s; } else s.textContent = ch;
    word.appendChild(s);
  }
  btns.forEach((b, i) => { b.className = "ch"; b.innerHTML = `<span class="n">${i + 1}</span>${G.q.choices[i]}`; });
  cardIn();
}
function cardIn() { cardEl.classList.remove("in"); void cardEl.offsetWidth; cardEl.classList.add("in"); }

function answer(i) {
  if (phase !== "play" || G.lock) return;
  const q = G.q, b = btns[i], ok = q.choices[i] === q.item.k, rt = fx.t - q.at;
  const r = b.getBoundingClientRect(), bx = r.left + r.width / 2, by = r.top + r.height / 2;
  if (ok) {
    G.combo++; G.ok++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.hits.push(fx.t);
    st(q.item.k)[0]++;
    const speed = rt < .9 ? 3 : rt < 1.6 ? 2 : 1;
    const mult = 1 + G.combo * .1;
    const gain = Math.round(100 * mult * speed * (G.combo >= GOD_COMBO ? 2 : 1));
    G.score += gain;
    if (speed > 1) G.timeLeft = Math.min(GAME_SEC, G.timeLeft + FAST_BONUS_SEC);
    holeEl.textContent = q.item.k; holeEl.className = "hole filled";
    b.className = "ch good";
    comboV.textContent = G.combo; multV.textContent = "×" + mult.toFixed(1);
    for (const e of [comboV, scoreV]) { e.classList.remove("bump"); void e.offsetWidth; e.classList.add("bump"); }
    popText(bx, by, "+" + gain.toLocaleString(), speed === 3);
    if (speed === 3) popText(W / 2, H * .3, "神速!!", true); else if (speed === 2) popText(W / 2, H * .3, "FAST!");
    shockwave(bx, by, .5 + .1 * speed); burst(bx, by, 14 + 8 * speed, .45 + .15 * speed);
    flash(.08 + .06 * speed, palAt(fx.shownGear, fx.hue));
    sfx.ok(G.combo, speed > 1); buzz(12);
    ticker.className = "ok"; ticker.textContent = `✔ ${q.item.w}(${q.item.r})`;
    // ギアと節目
    const g = GEARS.filter(x => G.combo >= x).length - 1;
    const ms = MILESTONES.includes(G.combo);
    if (g !== fx.gear) { setGear(g); sfx.gear(); }
    if (ms) {
      const lvl = MILESTONES.indexOf(G.combo);
      slam(`${G.combo} COMBO!!`, g !== fx.morphFrom && fx.t - fx.morphAt < .1 ? `▶▶ ${GEAR_NAMES[g]}` : (G.combo >= GOD_COMBO ? "★ 神 速 ★" : ""));
      flash(Math.min(1, .4 + .12 * lvl)); fireworks(3 + lvl * 2); shockwave(W / 2, H / 2, 1.8); sfx.milestone(); buzz([30, 30, 60]);
    } else if (fx.t - fx.morphAt < .1) slam(GEAR_NAMES[g]);
    G.lock = true;
    setTimeout(() => { if (phase === "play") { G.lock = false; next(); } }, 110);
  } else {
    const lostCombo = G.combo;
    G.combo = 0; G.ng++; st(q.item.k)[1]++;
    G.wrong.set(q.item.k, q.item);
    G.requeue.push({ item: q.item, due: G.qCount + 3 });
    G.timeLeft -= MISS_PENALTY;
    if (fx.gear !== 0) setGear(0);
    comboV.textContent = "0"; multV.textContent = "×1.0";
    b.className = "ch bad";
    btns[q.choices.indexOf(q.item.k)].className = "ch reveal";
    holeEl.textContent = q.item.k; holeEl.className = "hole miss";
    fx.lost = 1; fx.shakeAt = fx.t; flash(.35, RED);
    popText(bx, by, `-${MISS_PENALTY}秒`);
    if (lostCombo >= 10) popText(W / 2, H * .3, `${lostCombo} COMBO 途切れた…`);
    sfx.ng(); buzz([60, 40, 60]);
    ticker.className = "ng"; ticker.textContent = `✖ 正解は「${q.item.k}」 ${q.item.w}(${q.item.r})`;
    G.lock = true;
    setTimeout(() => { if (phase === "play") { G.lock = false; next(); } }, 950);
  }
}

function finish() {
  phase = "end"; G.lock = true;
  slam("FINISH!!", `${G.ok}問 正解`); sfx.end(); flash(.7); shockwave(W / 2, H / 2, 2);
  persist();
  setTimeout(showResult, 1500);
}
function showResult() {
  phase = "result"; show("result");
  const newBest = G.score > save.best && !G.weak;
  if (newBest) { save.best = G.score; persist(); }
  const rank = G.score >= 30000 ? "S" : G.score >= 18000 ? "A" : G.score >= 9000 ? "B" : "C";
  $("#rank").textContent = rank;
  $("#rscore").textContent = G.score.toLocaleString();
  $("#rnew").textContent = newBest ? "★ NEW RECORD ★" : G.weak ? "苦手特訓 おつかれ!" : `ベスト ${save.best.toLocaleString()}`;
  $("#rC").textContent = G.ok;
  $("#rA").textContent = (G.ok + G.ng ? Math.round(G.ok / (G.ok + G.ng) * 100) : 0) + "%";
  $("#rM").textContent = G.maxCombo; $("#rK").textContent = G.maxKpm;
  const miss = [...G.wrong.values()];
  $("#rmissT").textContent = miss.length ? `まちがえた漢字 ${miss.length}字 ── ここだけ覚えれば勝ち!!` : "ノーミス!! 天才!!";
  const box = $("#rmiss"); box.textContent = "";
  for (const m of miss) { const d = document.createElement("div"); d.innerHTML = `<b>${m.k}</b><span>${m.w}<br>${m.r}</span>`; box.appendChild(d); }
  refreshTitle();
  fx.gear = rank === "S" ? 2 : rank === "A" ? 1 : 0; fx.morphFrom = fx.gear;
  setTimeout(() => {
    slam(rank === "S" ? "S RANK!!!" : rank + " RANK!", newBest ? "★ NEW RECORD ★" : "");
    fireworks(newBest || rank === "S" ? 14 : 5); flash(.6); shockwave(W / 2, H * .25, 2); (newBest ? sfx.fanfare : sfx.milestone)();
  }, 120);
}

// ───────────────────────── 入力 ─────────────────────────
btns.forEach((b, i) => b.addEventListener("pointerdown", e => { e.preventDefault(); answer(i); }));
$("#bStart").onclick = () => start(false);
$("#bWeak").onclick = () => start(true);
$("#bAgain").onclick = () => start(G?.weak && weakList().length ? true : false);
$("#bWeak2").onclick = () => start(true);
$("#bTitle").onclick = () => { phase = "title"; fx.gear = fx.morphFrom = 1; fx.energyTarget = .3; refreshTitle(); show("title"); };
$("#mute").onclick = () => { muted = !muted; $("#mute").textContent = muted ? "🔇" : "🔊"; audio(); };
addEventListener("keydown", e => {
  if (e.repeat) return;
  if (phase === "play" && e.key >= "1" && e.key <= "4") answer(+e.key - 1);
  else if ((e.key === " " || e.key === "Enter") && (phase === "title" || phase === "result")) { e.preventDefault(); start(false); }
});

refreshTitle();
requestAnimationFrame(loop);
</script>
</body>
